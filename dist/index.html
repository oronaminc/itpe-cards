<title>정보관리기술사 단어장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Pen+Script&display=swap">
<style>
:root{
  --paper:#f3efe3;
  --sheet:#fbf9f2;
  --ink:#141a2e;
  --ink-2:#3a4262;
  --ink-3:#6a7190;
  --rule:#d8dbe3;
  --rule-2:#a7aec3;
  --on-ink:#f8f5ec;
  --ok:#1e6b43;
  --ok-bg:#e1eee4;
  --bad:#bd2e27;
  --bad-bg:#f7e1dd;
  --mid:#835f17;
  --mid-bg:#f0e5c9;
  --focus:#2b59c3;
  --shade:rgba(20,26,46,.07);
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;
  --pen:"Nanum Pen Script","Nanum Pen","Apple SD Gothic Neo","Noto Sans CJK KR",cursive;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0d1220; --sheet:#151b2d; --ink:#ebe6d7; --ink-2:#c6c2b5; --ink-3:#8f94a8;
    --rule:#242c45; --rule-2:#454e72; --on-ink:#0d1220;
    --ok:#6cc792; --ok-bg:#12291c; --bad:#ff8074; --bad-bg:#371815; --mid:#e3b85f; --mid-bg:#2f250e;
    --focus:#8fb1ff; --shade:rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0d1220; --sheet:#151b2d; --ink:#ebe6d7; --ink-2:#c6c2b5; --ink-3:#8f94a8;
  --rule:#242c45; --rule-2:#454e72; --on-ink:#0d1220;
  --ok:#6cc792; --ok-bg:#12291c; --bad:#ff8074; --bad-bg:#371815; --mid:#e3b85f; --mid-bg:#2f250e;
  --focus:#8fb1ff; --shade:rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;
  padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:30}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.pen{font-family:var(--pen);font-weight:400;letter-spacing:.01em}

/* 옆 여백: 한 곳에서만 정의 */
.gutter{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:560px;margin-inline:auto}

/* 헤더 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);padding-block:10px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:32px}
.brand{display:flex;align-items:baseline;gap:6px;min-width:0}
.brand b{font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:13px;color:var(--ink-3);white-space:nowrap}
.store{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:1;color:var(--ink-2);border:1px solid var(--rule-2);padding:6px 8px;border-radius:2px;white-space:nowrap}
.store::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.store[data-m="db"]::before{background:var(--ok)}
.store[data-m="pending"]::before{background:transparent;border:1px solid var(--ink-3)}

main{padding-block:14px calc(92px + env(safe-area-inset-bottom,0px))}
h2{font-size:20px;line-height:1.3;margin:4px 0 4px;font-weight:700;letter-spacing:-.01em}
.muted{color:var(--ink-3);font-size:13px;margin:0}
.lab{display:block;font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.04em;margin:18px 0 8px}

/* 덱 탭 */
.decks{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--ink);border-radius:2px;overflow:hidden}
.deck-tab{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-height:64px;padding:10px 12px;text-align:left;border-left:1px solid var(--ink)}
.deck-tab:first-child{border-left:0}
.deck-tab[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.dt-name{font-size:17px;font-weight:700}
.dt-n{font-size:12px;opacity:.75}
.dt-due{font-size:11px;font-weight:600;margin-top:2px;padding:1px 5px;border:1px solid currentColor;border-radius:2px;opacity:.9}

/* 칩 */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:6px 10px;border:1px solid var(--rule-2);border-radius:2px;font-size:14px;line-height:1.2;color:var(--ink-2);background:var(--sheet);position:relative}
.chip::after{content:"";position:absolute;inset:-4px 0}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--on-ink);font-weight:600}
.chip small{font-size:11px;opacity:.7;margin-left:3px}

/* 오늘 복습 */
.today{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:18px;min-height:92px;padding:14px 16px;background:var(--ink);color:var(--on-ink);border-radius:2px;text-align:left;box-shadow:4px 4px 0 var(--rule-2)}
.today:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--rule-2)}
.today-k{display:block;font-size:20px;font-weight:700}
.today-s{display:block;font-size:13px;opacity:.75;margin-top:2px}
.today-n{font-size:46px;font-weight:700;line-height:1;letter-spacing:-.02em;white-space:nowrap}
.today-n small{font-size:16px;font-weight:500;margin-left:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:60px;padding:10px 14px;border:1px solid var(--ink);border-radius:2px;background:var(--sheet);text-align:left;font-weight:700;font-size:16px}
.btn small{font-weight:400;font-size:12px;color:var(--ink-3)}
.btn:active{background:var(--rule)}
.btn-ink{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;background:var(--ink);color:var(--on-ink);border-radius:2px;font-weight:700;font-size:16px}
.btn-line{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border:1px solid var(--ink);border-radius:2px;font-weight:600;background:var(--sheet)}
.link{min-height:44px;padding:0 4px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;font-size:14px}

/* 설정 줄 */
.opts{display:grid;gap:10px;margin-top:20px;padding-top:14px;border-top:1px dashed var(--rule-2)}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.opt-row > span{font-size:14px;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:2px;overflow:hidden}
.seg button{min-height:40px;min-width:44px;padding:0 10px;font-size:14px;border-left:1px solid var(--rule-2);color:var(--ink-2);background:var(--sheet)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);font-weight:600}

/* 진도 */
.prog-list{display:grid;gap:14px;margin-top:4px}
.prog-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;margin-bottom:6px}
.prog-h b{font-size:15px}
.prog-h span{color:var(--ink-3);font-size:12px}
.pbar{display:flex;height:10px;background:var(--rule);border-radius:1px;overflow:hidden}
.pbar i{display:block;height:100%}
.pbar .k{background:var(--ok)} .pbar .u{background:var(--mid)} .pbar .d{background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:12px;color:var(--ink-2)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;margin-right:4px;vertical-align:0;background:var(--rule)}
.legend .k::before{background:var(--ok)} .legend .u::before{background:var(--mid)} .legend .d::before{background:var(--bad)}

.panel{margin-top:14px;padding:14px;border:1px solid var(--rule-2);background:var(--sheet);border-radius:2px}
.panel p{margin:0 0 10px}
.panel .row2{margin-top:10px}
.danger{display:flex;align-items:center;justify-content:center;min-height:48px;border:1px solid var(--bad);color:var(--bad);background:var(--bad-bg);border-radius:2px;font-weight:700}
.empty{padding:28px 16px;border:1px dashed var(--rule-2);text-align:center;color:var(--ink-3);margin-top:16px}

/* 세션 */
.sess-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:-6px}
.sess-n{font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink-2);white-space:nowrap}
.sess-bar{height:3px;background:var(--rule);margin:2px 0 14px}
.sess-bar i{display:block;height:100%;background:var(--ink)}
.tag{display:inline-block;font-size:12px;line-height:1.2;padding:3px 6px;border:1px solid var(--rule-2);border-radius:2px;color:var(--ink-2);white-space:nowrap}
.tag.imp-hi{border-color:var(--ink);color:var(--ink);font-weight:600}

.card{position:relative;display:flex;flex-direction:column;min-height:min(56svh,460px);padding:16px 16px 18px;background:var(--sheet);border:1px solid var(--rule-2);border-radius:2px;
  box-shadow:0 1px 0 var(--rule),5px 5px 0 -1px var(--paper),5px 5px 0 0 var(--rule-2);cursor:pointer;overflow-wrap:anywhere;word-break:keep-all}
.card-meta{display:flex;flex-wrap:wrap;gap:6px}
.face{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:18px 4px}
.hint{margin:0;text-align:center;font-size:12px;color:var(--ink-3)}
.anim{animation:turn .2s ease-out}
@keyframes turn{from{opacity:0;transform:perspective(900px) rotateX(-8deg) translateY(6px)}to{opacity:1;transform:none}}
.f-abbr{font-size:clamp(44px,15vw,76px);font-weight:700;line-height:1.05;letter-spacing:.01em}
.f-ko{font-size:clamp(26px,7.4vw,34px);font-weight:700;line-height:1.3}
.f-sub{margin-top:12px;font-size:15px;color:var(--ink-2);max-width:30em}
.f-dueum{font-size:clamp(46px,14vw,64px);line-height:1.1}
.f-topic{margin-top:10px;font-size:18px;font-weight:600;color:var(--ink-2)}
.f-topic-lg{font-size:clamp(24px,7vw,30px);font-weight:700;line-height:1.35}
.f-group{margin-top:10px;font-size:14px;color:var(--ink-3)}

/* 뒷면: 답안지 점선 괘선 */
.back{flex:1;display:flex;flex-direction:column;padding-top:12px}
.b-q{font-size:14px;color:var(--ink-3);padding-bottom:8px;border-bottom:1px solid var(--rule-2)}
.b-q .pen{font-size:22px;color:var(--ink-2)}
.ruled{--lh:36px;flex:1;line-height:var(--lh);padding:0 0 0 12px;margin-left:30px;border-left:1px solid var(--rule-2);
  background-image:radial-gradient(circle at 1px 1px,var(--rule-2) 1px,transparent 1.3px);background-size:6px var(--lh);background-position:0 calc(var(--lh) - 3px)}
.ruled p{margin:0}
.b-lab{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.04em}
.b-main{font-size:19px;font-weight:600}
.b-main b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.b-big{font-family:var(--pen);font-size:34px;color:var(--ink)}
.b-abbr{font-size:34px;font-weight:700}
.b-pen{font-family:var(--pen);font-size:27px;color:var(--ink)}
.b-sub{font-size:14px;color:var(--ink-2)}
.b-mean{font-size:14px;color:var(--ink-2);line-height:1.6;padding-block:6px}
.b-text{font-size:15px}
.b-empty{font-size:14px;color:var(--ink-3)}
.b-foot{font-size:12px;color:var(--ink-3)}

.pairs{list-style:none;padding:0;margin:0 0 0 0;border-left:0;padding-left:0;margin-left:0;background-position:46px calc(var(--lh) - 3px)}
.pairs li{display:grid;grid-template-columns:44px 1fr;align-items:end;min-height:var(--lh)}
.p-k{display:flex;align-items:center;justify-content:center;height:var(--lh);font-family:var(--pen);font-size:28px;line-height:1;border-right:1px solid var(--rule-2);color:var(--ink)}
.p-v{padding-left:12px;font-size:16px}
.pairs.obo{--lh:46px}
.pairs.obo .p-k{border:1px solid var(--rule-2);border-right-width:1px;margin:3px 4px 3px 0;height:40px;background:var(--paper);border-radius:2px}
.pairs.obo .p-k[aria-expanded="true"]{background:var(--sheet);border-color:var(--ink)}
.pairs.obo .p-v:empty::before{content:"";display:inline-block;width:60%;height:1px}
.note{font-size:12px;color:var(--ink-3);margin-top:8px}
.mini-row{display:flex;justify-content:flex-end;margin-top:6px}

/* 하단 고정 바 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .wrap{padding-block:8px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.tabs button{min-height:52px;font-size:15px;font-weight:600;color:var(--ink-3);display:flex;align-items:center;justify-content:center;gap:6px;border-top:3px solid transparent;margin-top:-8px}
.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--ink)}
.badge{font-size:11px;font-weight:700;min-width:20px;padding:1px 5px;border:1px solid var(--bad);color:var(--bad);border-radius:2px;line-height:1.4}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60px;border:1px solid currentColor;border-radius:2px;font-weight:700;font-size:16px;line-height:1.2}
.g small{font-weight:400;font-size:11px;opacity:.85;margin-top:3px}
.g-bad{color:var(--bad);background:var(--bad-bg)}
.g-mid{color:var(--mid);background:var(--mid-bg)}
.g-ok{color:var(--ok);background:var(--ok-bg)}

/* 4지선다 */
.q-card{padding:16px;background:var(--sheet);border:1px solid var(--rule-2);border-radius:2px;box-shadow:0 1px 0 var(--rule),5px 5px 0 -1px var(--paper),5px 5px 0 0 var(--rule-2);overflow-wrap:anywhere;word-break:keep-all}
.q-ask{font-size:13px;color:var(--ink-3);margin:12px 0 0}
.q-prompt{font-size:clamp(24px,7vw,30px);font-weight:700;line-height:1.3;margin:8px 0 2px}
.q-prompt.pen{font-weight:400;font-size:clamp(30px,9vw,40px);line-height:1.25}
.q-prompt.big{font-size:clamp(40px,13vw,60px)}
.q-prompt.text{font-size:17px;font-weight:500;line-height:1.6}
.q-sub{font-size:14px;color:var(--ink-2);margin:6px 0 0}
.opts-q{display:grid;gap:8px;margin-top:16px}
.opt{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;min-height:56px;padding:8px 12px;border:1px solid var(--rule-2);border-radius:2px;background:var(--sheet);text-align:left;overflow-wrap:anywhere;word-break:keep-all}
.opt-n{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.opt-t{font-size:16px;font-weight:600;line-height:1.35}
.opt-t.pen{font-weight:400;font-size:26px;line-height:1.2}
.opt-t small{display:block;font-size:12px;font-weight:400;color:var(--ink-3);margin-top:2px}
.opt-m{font-size:13px;font-weight:700;white-space:nowrap}
.opt.is-ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.is-ok .opt-m{color:var(--ok)}
.opt.is-bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.is-bad .opt-m{color:var(--bad)}
.opt:disabled{cursor:default}
.opt:disabled:not(.is-ok):not(.is-bad){opacity:.6}

/* 결과 */
.score{display:flex;align-items:baseline;gap:8px;margin:12px 0 4px}
.score b{font-family:var(--pen);font-weight:400;font-size:84px;line-height:.9}
.score span{font-size:22px;color:var(--ink-2)}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.t{padding:10px;border:1px solid currentColor;border-radius:2px;font-size:13px}
.t b{display:block;font-size:28px;line-height:1.1}
.t.ok{color:var(--ok);background:var(--ok-bg)} .t.mid{color:var(--mid);background:var(--mid-bg)} .t.bad{color:var(--bad);background:var(--bad-bg)}
.stack{display:grid;gap:10px;margin-top:16px}

/* 목록 (오답·찾기) */
.list{list-style:none;padding:0;margin:12px 0 0;border-top:1px solid var(--rule-2)}
.list > li{border-bottom:1px solid var(--rule)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:56px;padding:10px 2px;text-align:left}
.row-main{min-width:0;flex:1;overflow-wrap:anywhere;word-break:keep-all}
.row-main b{font-weight:700}
.row-main .pen{font-size:22px;margin-right:4px}
.row-main small{display:block;color:var(--ink-3);font-size:12px;margin-top:1px}
.row-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.box{font-size:11px;padding:1px 5px;border:1px solid var(--rule-2);border-radius:2px;color:var(--ink-2);white-space:nowrap}
.box.b0{border-color:var(--bad);color:var(--bad)}
.x{font-size:11px;color:var(--bad);white-space:nowrap}
.detail{padding:4px 0 14px}
.detail .ruled{margin-left:0;border-left:0;padding-left:0;background-position:0 calc(var(--lh) - 3px)}
.search{display:flex;gap:8px;align-items:center}
.search input{flex:1;min-width:0;min-height:50px;padding:10px 12px;border:1px solid var(--ink);border-radius:2px;background:var(--sheet);font-size:17px}
.search input::placeholder{color:var(--ink-3)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;max-width:min(92vw,520px);padding:10px 14px;background:var(--ink);color:var(--on-ink);font-size:14px;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important;scroll-behavior:auto !important}
  .today:active{transform:none}
}
</style>

<header class="top gutter">
  <div class="wrap">
    <div class="brand"><b>정보관리기술사</b><span>단어장</span></div>
    <span id="store" class="store" data-m="pending" title="진도 저장 위치">저장 위치 확인 중</span>
  </div>
</header>
<main id="app" class="gutter" tabindex="-1"></main>

IM","def":"메모리 안에 연산 기능을 넣어 프로세서와 메모리 사이 데이터 이동을 줄이는 반도체 (메모리 벽 해소)","kw":"데이터 이동 최소화, 메모리 대역폭, 에너지 효율, HBM-PIM","src":"컴시응 129-1-1 · 정관 미출제"},{"id":"chiplet","tier":"1순위","basis":"컴시응 선행","topic":"칩렛 (Chiplet)","base":"SoC → 칩렛","def":"기능별로 나눈 작은 다이를 패키징으로 이어 붙여 하나의 칩처럼 쓰는 반도체 설계 (미세 공정 한계 대응)","kw":"개발 효율성, 반도체 패키징, 미세 공정 한계, 이어붙이는 방법","src":"컴시응 131-2-5 (개념·장점·연결 방법) · 정관 미출제"},{"id":"cxl3","tier":"1순위","basis":"컴시응 선행","topic":"메모리 월 (Memory Wall)과 CXL 3.0","base":"CXL (정관 136) → CXL 3.0","def":"프로세서 속도에 비해 메모리 지연·대역폭이 못 따라가는 격차(메모리 월)를 CXL 3.0의 캐시 일관성·메모리 풀링으로 해소","kw":"Memory Latency, Memory Bandwidth, CXL 3.0, Cache Coherency, Memory Pooling","src":"컴시응 140-3-1 · 정관은 136에 CXL 기본만"},{"id":"ttft","tier":"1순위","basis":"컴시응 선행","topic":"TTFT와 TPOT 비교","base":"응답시간·처리량 → LLM 추론 지표","def":"TTFT: 요청 후 첫 토큰까지 시간(Prefill 단계) / TPOT: 출력 토큰 하나당 시간(Decoding 단계)","kw":"Prefill, Decoding, 병렬처리, Batch Size, KV 캐시, 메모리 대역폭, 양자화","src":"컴시응 138-1-6 · 정관 미출제"},{"id":"paged","tier":"1순위","basis":"컴시응 선행","topic":"페이지드 어텐션 (Paged Attention)","base":"OS 가상메모리 페이징 → LLM KV 캐시 관리","def":"KV 캐시를 고정 크기 블록(페이지)으로 나눠 비연속 메모리에 저장해 단편화를 줄이고 동적 배치를 늘리는 LLM 서빙 기법","kw":"KV 캐시, 페이지 블록, 메모리 단편화, 동적 배치","src":"컴시응 140-1-1 · 정관 미출제"},{"id":"asi","tier":"1순위","basis":"정관 다음 칸","topic":"OWASP Top 10 for Agentic Applications","base":"OWASP LLM Top 10 (정관 136) → 에이전트판","def":"AI 에이전트 고유의 10대 보안 위협. ASI01 목표 탈취 · ASI02 도구 오용 · ASI03 신원·권한 남용 · … · ASI10 통제 이탈 에이전트","kw":"목표 탈취, 도구 오용, 신원·권한 남용, 메모리 오염, 연쇄 실패, 최소 권한, HITL","src":"OWASP 2025.12 발표 · 정관 미출제 · 볼트 노트 예상_AI에이전트통제"},{"id":"agbom","tier":"1순위","basis":"정관 다음 칸","topic":"AI BOM · AgBOM","base":"SBOM (정관 131·134) → AI BOM → AgBOM","def":"에이전트가 쓰는 모델·도구·역량·지식·메모리를 목록화한 에이전트 자재명세서. 공공 SBOM 제출 제도화(2027 예정)와 연결","kw":"모델·도구·역량·지식·메모리(모툴캐날메), CycloneDX ML-BOM, SPDX 3.0 AI, 런타임 통제(ACS)","src":"OWASP ACS·AgBOM 2026.9 · SW 공급망 보안 로드맵 2026.6"},{"id":"a2a","tier":"1순위","basis":"정관 다음 칸","topic":"A2A (Agent-to-Agent) 프로토콜","base":"MCP (정관 136) → A2A","def":"에이전트끼리 작업을 주고받는 개방형 통신 프로토콜. MCP는 에이전트↔도구(수직), A2A는 에이전트↔에이전트(수평)","kw":"Agent Card, Task, Message, JSON-RPC, 멀티벤더 협업","src":"ITPE 토픽 1721 · 정관 미출제"},{"id":"selfatt","tier":"2순위","basis":"컴시응 선행","topic":"Self-Attention 메커니즘","base":"트랜스포머 (정관 137) → 내부 메커니즘","def":"입력 토큰끼리 Query·Key 내적으로 유사도를 구하고 Softmax 가중치로 Value를 가중합하는 메커니즘","kw":"Query·Key·Value, 내적, 유사도, Softmax, 가중합, Transformer","src":"컴시응 138-1-5 · 정관 미출제"},{"id":"platform","tier":"2순위","basis":"컴시응 선행","topic":"플랫폼 엔지니어링 (Platform Engineering)","base":"DevOps → 플랫폼 엔지니어링","def":"개발자가 셀프서비스로 쓰는 내부 개발자 플랫폼(IDP)을 만들어 SW 수명주기를 표준화·자동화하는 활동","kw":"SW 수명주기 관리 플랫폼, 셀프서비스, 골든 패스, Cross Functional Team","src":"컴시응 134-1-9 · 정관 미출제"},{"id":"affective","tier":"2순위","basis":"컴시응 선행","topic":"정서 인공지능 (Affective AI)","base":"멀티모달 AI → 감성 인식","def":"표정·음성·텍스트 같은 멀티모달 데이터로 사람의 감정을 인식·이해해 공감하는 응답을 하는 AI","kw":"감성인식, 멀티모달 데이터, 맥락 이해, 공감적 응답, 윤리·프라이버시","src":"컴시응 140-1-8 · 정관 미출제"},{"id":"modeldos","tier":"2순위","basis":"컴시응 선행","topic":"Model DoS","base":"DoS → LLM 서비스 거부","def":"정상 입력처럼 위장한 고비용 요청으로 모델 자원을 고갈시켜 서비스 가용성을 떨어뜨리는 공격 (추론 비용 비대칭)","kw":"추론 비용 비대칭, 모델 자원 고갈, 정상 입력 위장, 가용성 저해, 토큰·요청 제한","src":"컴시응 138-1-4 · 정관 미출제 (OWASP Unbounded Consumption과 연결)"},{"id":"ctxeng","tier":"2순위","basis":"정관 다음 칸","topic":"컨텍스트 엔지니어링 (Context Engineering)","base":"프롬프트 엔지니어링 (135) → 하네스 엔지니어링 (140) → 컨텍스트 엔지니어링","def":"추론 시점에 모델에 넣을 지시·도구·메모리·검색 결과를 골라 최적의 토큰 묶음으로 관리하는 기법","kw":"컨텍스트 창, 압축(Compaction), 메모리, JIT 검색, 도구 결과 정리","src":"ITPE 토픽 1790 · 정관 미출제"},{"id":"graphrag","tier":"2순위","basis":"정관 다음 칸","topic":"GraphRAG","base":"RAG (134) → Advanced·Modular RAG (139) → GraphRAG","def":"문서에서 개체·관계로 지식 그래프를 만들어 검색에 쓰는 RAG. 여러 문서에 걸친 질문에 강함","kw":"지식 그래프, 개체·관계 추출, 커뮤니티 요약, 다중 홉 질의","src":"흐름상 다음 칸 추정 (기출·ITPE 근거 없음)"},{"id":"llm2026","tier":"2순위","basis":"최근 발표","topic":"OWASP LLM Top 10 2026 개정","base":"OWASP LLM Top 10 2025 (정관 136) → 2026판","def":"2026판에서 Excessive Agency가 3위로 오르고 Hidden Context Exposure가 새로 들어감. 2025판과 비교형 출제 가능","kw":"LLM03 Excessive Agency, LLM08 Hidden Context Exposure, 2025 vs 2026","src":"OWASP 2026.8 발표 · 정관 136-4-5는 2025판"},{"id":"redteam","tier":"2순위","basis":"최근 발표","topic":"AI 레드티밍","base":"모의해킹 → AI 레드티밍","def":"공격자 관점에서 AI 모델·에이전트의 취약점(탈옥·프롬프트 인젝션·데이터 유출)을 찾는 적대적 평가","kw":"준비·이행·결과 보고, 교전 규칙(RoE), 탈옥, 프롬프트 인젝션, 조치 우선순위","src":"과기정통부 AI 보안 레드티밍 가이드 2026.7 · 정관 미출제"},{"id":"leo","tier":"2순위","basis":"최근 발표","topic":"저궤도(LEO) 위성통신 · NTN","base":"5G·6G·SATIN (128) → 비지상망","def":"고도 약 300~1,500km 저궤도 위성으로 지연을 줄인 위성 인터넷. 지상망(TN)과 통합한 비지상망(NTN)","kw":"위성 간 링크(ISL), 게이트웨이, D2C, 투명·재생 페이로드, 도플러","src":"정관 미출제 · 볼트 노트 예상_LEO위성"},{"id":"chaos","tier":"3순위","basis":"재출제","topic":"카오스 엔지니어링 (Chaos Engineering)","base":"카오스 테스트 (정관 120) → 카오스 엔지니어링","def":"운영 환경에 의도적으로 장애를 주입해 시스템 복원력을 검증하는 실험","kw":"Steady State, Fault Injection, 복원력, 영향 범위(Blast Radius), 자동화","src":"정관 120-1-10 · 컴시응 140-1-11"},{"id":"slicing","tier":"3순위","basis":"재출제","topic":"5G 네트워크 슬라이싱","base":"5G (정관 118) → 슬라이싱","def":"하나의 물리망을 서비스 요구(eMBB·URLLC·mMTC)별 독립된 가상망으로 나누는 기술","kw":"eMBB, URLLC, mMTC, NFV·SDN, 종단 간 슬라이스","src":"정관 118-1-10 · 컴시응 140-1-7"},{"id":"ondevice","tier":"3순위","basis":"재출제","topic":"온디바이스 AI (vs 클라우드 AI)","base":"클라우드 AI → 온디바이스 AI","def":"클라우드 없이 단말의 NPU와 경량 모델로 직접 추론하는 AI. 지연·개인정보 유출이 적음","kw":"AI 가속기, NPU, 경량 AI 모델, 클라우드 AI 비교","src":"정관 127-2-4 · 컴시응 134-1-3, 137-1-2"},{"id":"dslm","tier":"3순위","basis":"최근 발표","topic":"도메인 특화 언어모델 (DSLM)","base":"LLM → 도메인 특화 언어모델","def":"특정 산업·업무 데이터로 학습·튜닝한 언어모델. 정확도와 규제 대응에 유리","kw":"파인튜닝, 도메인 데이터, 정확도, 규제 준수","src":"가트너 2026 전략기술 · 정관 미출제"},{"id":"confidential","tier":"3순위","basis":"최근 발표","topic":"기밀 컴퓨팅 (Confidential Computing)","base":"저장·전송 암호화 → 사용 중 데이터 보호","def":"사용 중인 데이터를 하드웨어 기반 신뢰 실행 환경(TEE)에서 보호한 채 처리하는 기술","kw":"TEE, 하드웨어 격리, 원격 증명(Attestation), 사용 중 데이터 암호화","src":"가트너 2026 전략기술 · 정관 미출제"}],"terms":[{"id":"dejure","cat":"표준·제도","term":"De jure","ko":"공식 표준","short":"공식기구 제정 표준","def":"ISO·IEC·ITU 같은 공식 표준화 기구가 합의·투표 절차로 제정한 표준","pair":"De facto(사실상 표준) · Forum(포럼 표준)","ex":"ISO 21502는 ISO/TC 258이 제정한 De jure 표준","key":"De jure","n":5,"ng":4,"src":"130회 정관 1교시 해설 p.36"},{"id":"defacto","cat":"표준·제도","term":"De facto","ko":"사실상 표준","short":"시장 점유 사실표준","def":"공식 제정은 아니지만 시장·업계에서 널리 쓰여 표준처럼 통하는 것","pair":"De jure(공식 표준)","ex":"PMBOK은 PMI가 만든 De facto 표준으로 PMP 시험의 기준","key":"De facto","n":8,"ng":6,"src":"137회 정관 1교시 해설 p.7"},{"id":"forum","cat":"표준·제도","term":"Forum Standard","ko":"포럼 표준","short":"업계 컨소시엄 합의","def":"기업·기관이 모인 포럼(컨소시엄)이 합의해 만든 표준. 공식 표준보다 제정이 빠름","pair":"De jure · De facto","ex":"W3C 같은 단체가 만든 Forum Standard는 공식 표준보다 제정이 빠름","key":"Forum Standard","n":0,"ng":0,"src":""},{"id":"guidance","cat":"표준·제도","term":"Guidance","ko":"지침 표준","short":"권고 지침, 인증 불가","def":"무엇을 하면 좋은지 권고(should)하는 표준. 제3자 인증 대상이 아님","pair":"Requirements(요구사항 표준)","ex":"ISO 21502·ISO 27002는 Guidance 표준이라 인증을 받을 수 없음","key":"Guidance","n":2,"ng":1,"src":"126회 컴시응 3교시 해설 p.14"},{"id":"requirements","cat":"표준·제도","term":"Requirements","ko":"요구사항 표준","short":"필수 요구, 인증 가능","def":"반드시 지켜야 할 요구사항(shall)을 정한 표준. 제3자 인증 심사의 기준","pair":"Guidance(지침 표준)","ex":"ISO 27001·ISO 42001은 Requirements 표준이라 인증 심사 기준이 됨","key":"Requirements","n":11,"ng":7,"src":"136회 정관 1교시 해설 p.23"},{"id":"shall","cat":"표준·제도","term":"Shall / Should / May","ko":"필수 / 권고 / 허용","short":"필수·권고·허용 구분","def":"ISO 문서의 표현. Shall = 반드시(요구사항), Should = 권장(지침), May = 허용","pair":"Requirements ↔ Guidance","ex":"요구사항 표준은 Shall, 지침 표준은 Should로 기술","key":"Shall","n":1,"ng":1,"src":"132회 컴시응 3교시 해설 p.18"},{"id":"normative","cat":"표준·제도","term":"Normative","ko":"규범적","short":"준수 필수 본문","def":"표준에서 반드시 따라야 하는 부분 (본문·규범 부속서)","pair":"Informative(참고용)","ex":"ISO 27001 부속서 A는 Normative 부속서로 통제 목록 제시","key":"Normative","n":5,"ng":3,"src":"138회 정관 1교시 해설 p.8"},{"id":"informative","cat":"표준·제도","term":"Informative","ko":"참고용","short":"이해 돕는 참고 내용","def":"이해를 돕는 설명·예시. 따르지 않아도 적합성에 영향 없음","pair":"Normative(규범적)","ex":"부속서의 사례·해설은 Informative로 참고만 함","key":"Informative","n":1,"ng":1,"src":"126회 컴시응 3교시 해설 p.15"},{"id":"certification","cat":"표준·제도","term":"Certification","ko":"인증","short":"인증기관 적합 심사","def":"인증기관이 조직·제품·사람이 표준 요구사항에 맞는지 심사해 확인","pair":"Accreditation(인정)","ex":"ISO 27001 Certification은 인정받은 인증기관이 심사","key":"Certification","n":8,"ng":4,"src":"138회 정관 1교시 해설 p.9"},{"id":"accreditation","cat":"표준·제도","term":"Accreditation","ko":"인정","short":"인증기관 자격 승인","def":"인정기구가 인증기관이 심사할 능력이 있는지 평가해 공식 승인","pair":"Certification(인증)","ex":"인정기구의 Accreditation을 받은 기관만 인증서 발급","key":"Accreditation","n":0,"ng":0,"src":""},{"id":"compliance","cat":"표준·제도","term":"Compliance","ko":"규제 준수(준거성)","short":"법·규제 준수 여부","def":"법·규제·내부 정책을 지키는 상태와 그 관리 활동","pair":"Conformity(표준 적합성)","ex":"AI 기본법 Compliance를 위해 고영향 AI 위험관리 체계 수립","key":"Compliance","n":36,"ng":17,"src":"140회 정관 2교시 해설 p.9"},{"id":"conformity","cat":"표준·제도","term":"Conformity","ko":"적합성","short":"표준 요구 충족 여부","def":"제품·프로세스가 표준·명세의 요구사항을 만족하는 것 (적합성 평가)","pair":"Compliance(규제 준수)","ex":"시험·검사·인증으로 Conformity 평가","key":"Conformity","n":1,"ng":1,"src":"129회 컴시응 2교시 해설 p.9"},{"id":"bestpractice","cat":"표준·제도","term":"Best Practice","ko":"모범 사례","short":"검증된 우수 관행","def":"여러 조직에서 효과가 검증되어 따라 하기 좋은 관행","pair":"Lessons Learned(교훈)","ex":"ITIL은 IT 서비스 관리 Best Practice 모음","key":"Best Practice","n":6,"ng":5,"src":"136회 정관 2교시 해설 p.22"},{"id":"framework","cat":"표준·제도","term":"Framework","ko":"프레임워크","short":"무엇을 할지 큰 틀","def":"무엇을 해야 하는지 구조와 원칙을 제시하는 틀. 구체적 방법은 조직이 정함","pair":"Methodology(방법론)","ex":"PMBOK은 Framework(지식 체계), PRINCE2는 방법론","key":"Framework","n":58,"ng":34,"src":"140회 정관 2교시 해설 p.16"},{"id":"methodology","cat":"표준·제도","term":"Methodology","ko":"방법론","short":"어떻게 할지 절차","def":"어떻게 할지 절차·기법·산출물·역할까지 정한 실행 방법","pair":"Framework(큰 틀)","ex":"PRINCE2는 역할·절차가 정해진 Methodology","key":"Methodology","n":3,"ng":2,"src":"136회 정관 1교시 해설 p.23"},{"id":"maturity","cat":"표준·제도","term":"Maturity Level","ko":"성숙도 단계","short":"조직 전체 단계 평가","def":"조직 전체 프로세스 수준을 단계로 평가하는 단계적(Staged) 표현","pair":"Capability Level(영역별, 연속적)","ex":"CMMI 단계적 표현은 Maturity Level 1~5로 조직 평가","key":"Maturity Level","n":1,"ng":1,"src":"118회 정관 1교시 해설 p.33"},{"id":"capability","cat":"표준·제도","term":"Capability Level","ko":"능력 단계","short":"영역별 능력 수준","def":"프로세스 영역마다 능력 수준을 따로 평가하는 연속적(Continuous) 표현","pair":"Maturity Level(조직 전체, 단계적)","ex":"CMMI 연속적 표현은 프로세스 영역마다 Capability Level 부여","key":"Capability Level","n":1,"ng":1,"src":"118회 정관 1교시 해설 p.33"},{"id":"process","cat":"프로젝트관리","term":"Process","ko":"프로세스","short":"입력→산출 활동 묶음","def":"입력물을 도구·기법으로 처리해 산출물을 만드는 정해진 활동 묶음","pair":"Practice(실무) · Procedure(절차)","ex":"PMBOK 8판은 성과 도메인 7개에 Process 40개","key":"Process","n":155,"ng":100,"src":"140회 정관 1교시 해설 p.2"},{"id":"practice","cat":"프로젝트관리","term":"Practice","ko":"실무","short":"결과 내는 활동 방식","def":"목표 달성을 위해 하는 활동 방식. 순서·입력물·산출물을 강제하지 않음","pair":"Process(프로세스)","ex":"ISO 21502는 프로세스 기반에서 Practice 기반으로 바뀜","key":"Practice","n":15,"ng":12,"src":"136회 정관 2교시 해설 p.22"},{"id":"procedure","cat":"프로젝트관리","term":"Procedure","ko":"절차","short":"작업 단계별 순서","def":"특정 작업을 수행하는 구체적 단계 순서. 프로세스보다 세부","pair":"Process · Practice","ex":"변경 통제 Procedure는 요청 → 영향 분석 → 승인 → 반영","key":"Procedure","n":23,"ng":16,"src":"138회 정관 2교시 해설 p.4"},{"id":"tailoring","cat":"프로젝트관리","term":"Tailoring","ko":"조정(맞춤)","short":"상황 맞춤 선별 적용","def":"조직·프로젝트 특성에 맞게 프로세스·산출물을 골라 줄이거나 바꾸는 것","pair":"One-size-fits-all(일괄 적용)","ex":"소규모 사업은 PMBOK 프로세스를 Tailoring해 핵심만 적용","key":"Tailoring","n":9,"ng":4,"src":"138회 정관 1교시 해설 p.2"},{"id":"baseline","cat":"프로젝트관리","term":"Baseline","ko":"기준선","short":"승인된 계획 고정본","def":"승인된 범위·일정·원가 계획의 고정본. 변경 통제를 거쳐야만 바뀜","pair":"Actual(실적) — 둘의 차이가 Variance(차이)","ex":"범위 Baseline은 범위 기술서 + WBS + WBS 사전","key":"Baseline","n":27,"ng":11,"src":"140회 정관 4교시 해설 p.22"},{"id":"deliverable","cat":"프로젝트관리","term":"Deliverable","ko":"인도물","short":"검증 가능한 결과물","def":"프로젝트가 만들어 고객에게 넘기는 검증 가능한 제품·결과·역량","pair":"Outcome(성과) · Artifact(작업 자료)","ex":"종료 단계에서 Deliverable 인수 확인 후 계약 종료","key":"Deliverable","n":5,"ng":3,"src":"139회 정관 1교시 해설 p.3"},{"id":"outcome","cat":"프로젝트관리","term":"Outcome","ko":"성과","short":"산출물 활용 결과","def":"산출물(Output)을 써서 생긴 변화·결과","pair":"Output → Outcome → Benefit → Value","ex":"산출물 → Outcome → 편익 → 가치 순으로 가치 실현","key":"Outcome","n":1,"ng":1,"src":"116회 컴시응 2교시 해설 p.29"},{"id":"benefit","cat":"프로젝트관리","term":"Benefit","ko":"편익","short":"측정 가능한 이익","def":"성과(Outcome)로 조직·이해관계자가 얻는 측정 가능한 이익","pair":"Outcome · Value","ex":"ISO 21502 사후 활동에서 Benefit 실현 여부 확인","key":"Benefit","n":13,"ng":8,"src":"129회 정관 4교시 해설 p.22"},{"id":"artifact","cat":"프로젝트관리","term":"Artifact","ko":"작업 산출 자료","short":"작업 중 생성 자료","def":"프로젝트 중 만들어지는 문서·템플릿·로그·계획서 같은 자료","pair":"Deliverable(인도물)","ex":"PMBOK 7판은 ITTO 대신 모델·방법·Artifact 제시","key":"Artifact","n":6,"ng":2,"src":"137회 정관 1교시 해설 p.2"},{"id":"charter","cat":"프로젝트관리","term":"Project Charter","ko":"프로젝트 헌장","short":"프로젝트 공식 승인","def":"프로젝트를 공식 승인하고 PM에게 자원 사용 권한을 주는 문서","pair":"사업관리계획서(PMP)","ex":"스폰서가 Project Charter를 승인하면 PM 임명·착수","key":"Project Charter","n":0,"ng":0,"src":""},{"id":"sponsor","cat":"프로젝트관리","term":"Sponsor","ko":"스폰서","short":"자금·지원 책임자","def":"자금·자원을 대고 프로젝트 성공을 책임지며 지원하는 사람·조직","pair":"PM(관리) · PO(제품 책임)","ex":"ISO 21502에서 Sponsor는 지휘, PM은 관리","key":"Sponsor","n":2,"ng":1,"src":"137회 컴시응 1교시 해설 p.10"},{"id":"governance","cat":"프로젝트관리","term":"Governance","ko":"거버넌스","short":"의사결정·감독 체계","def":"누가 무엇을 결정하고 책임·감독하는지 정한 체계","pair":"Management(정한 틀 안에서 실행)","ex":"Governance는 올바른 일을, 관리는 일을 올바르게","key":"Governance","n":69,"ng":40,"src":"140회 정관 2교시 해설 p.7"},{"id":"phasegate","cat":"프로젝트관리","term":"Phase Gate","ko":"단계 관문","short":"단계 끝 진행 결정","def":"단계 끝에서 계속·수정·중단을 결정하는 검토 지점 (Stage Gate, Kill Point)","pair":"Go / No-go 결정","ex":"Phase Gate에서 사업 타당성 재검토 후 진행 여부 결정","key":"Phase Gate","n":0,"ng":0,"src":""},{"id":"progressive","cat":"프로젝트관리","term":"Progressive Elaboration","ko":"점진적 구체화","short":"정보 늘수록 상세화","def":"정보가 늘어날수록 계획을 점점 더 자세하고 정확하게 다듬는 것","pair":"Rolling Wave Planning(연동 계획)","ex":"개략 산 :"리스크·변경","term":"Workaround","ko":"임시 해결책","short":"계획 없던 즉석 대응","def":"계획에 없던 리스크·이슈가 터졌을 때 즉석에서 하는 대응","pair":"Contingency Plan(사전 대응 계획)","ex":"미식별 장애에 Workaround 적용 후 근본 원인 분석","key":"Workaround","n":0,"ng":0,"src":""},{"id":"appetite","cat":"리스크·변경","term":"Risk Appetite","ko":"리스크 선호도","short":"감수할 위험 수준","def":"목표를 위해 조직이 감수하려는 리스크의 전반적 수준 (전략)","pair":"Risk Tolerance(허용 범위, 수치)","ex":"이사회가 Risk Appetite를 정하고 부서별 한도로 구체화","key":"Risk Appetite","n":0,"ng":0,"src":""},{"id":"tolerance","cat":"리스크·변경","term":"Risk Tolerance","ko":"리스크 허용 범위","short":"허용 가능 변동 폭","def":"목표 대비 받아들일 수 있는 변동 범위 (구체적 수치)","pair":"Risk Appetite(선호도)","ex":"일정 Risk Tolerance ±10% 초과 시 상향 보고","key":"Risk Tolerance","n":0,"ng":0,"src":""},{"id":"changecontrol","cat":"리스크·변경","term":"Change Control","ko":"변경 통제","short":"변경 영향 분석 승인","def":"변경 요청을 영향 분석·승인 후 기준선에 반영하는 절차","pair":"Configuration Management(형상관리)","ex":"변경 요청은 변경통제위원회 심의를 거치는 Change Control로 반영","key":"Change Control","n":0,"ng":0,"src":""},{"id":"tradeoff","cat":"답안 서술어","term":"Trade-off","ko":"상충 관계","short":"하나 얻고 하나 잃음","def":"하나를 얻으면 다른 하나를 잃는 관계","pair":"Balance(균형점)","ex":"보안성과 편의성의 Trade-off 고려해 위험 기반 인증","key":"Trade-off","n":60,"ng":28,"src":"140회 정관 1교시 해설 p.2"},{"id":"holistic","cat":"답안 서술어","term":"Holistic","ko":"전체적","short":"시스템 전체 관점","def":"부분이 아닌 시스템 전체와 상호작용을 보는 관점","pair":"Silo(단절)","ex":"PMBOK 8판 첫 원칙은 Holistic View 채택","key":"Holistic","n":1,"ng":0,"src":"260415_[제1권] AI 데이터 품질관리 가이드 v4.0_배포용.pd p.286"},{"id":"accountability","cat":"답안 서술어","term":"Accountability","ko":"최종 책임","short":"결과 최종 책임 1인","def":"결과에 대해 최종적으로 책임지고 설명할 의무. 작업당 한 사람","pair":"Responsibility(실행 책임, 여러 명)","ex":"RACI의 A(Accountability)는 작업당 한 명","key":"Accountability","n":18,"ng":12,"src":"140회 정관 1교시 해설 p.12"},{"id":"responsibility","cat":"답안 서술어","term":"Responsibility","ko":"실행 책임","short":"맡은 일 수행 책임","def":"맡은 일을 실제로 수행할 책임. 여러 명이 나눌 수 있음","pair":"Accountability(최종 책임)","ex":"RACI의 R(Responsibility)은 실제 작업 수행자","key":"Responsibility","n":9,"ng":7,"src":"133회 정관 1교시 해설 p.22"},{"id":"proactive","cat":"답안 서술어","term":"Proactive","ko":"선제적","short":"사전 예측 대응","def":"문제가 생기기 전에 예측해 미리 대응","pair":"Reactive(사후 대응)","ex":"위협 헌팅으로 Proactive 보안 체계 전환","key":"Proactive","n":8,"ng":8,"src":"129회 정관 3교시 해설 p.26"},{"id":"topdown","cat":"답안 서술어","term":"Top-down","ko":"하향식","short":"상위 전체→하위 분해","def":"전체·상위에서 시작해 하위로 나눔 (전문가·유사 산정)","pair":"Bottom-up(하위 합산)","ex":"초기에는 Top-down 산정, 설계 후 상향식 산정","key":"Top-down","n":16,"ng":11,"src":"139회 정관 1교시 해설 p.3"},{"id":"bottomup","cat":"답안 서술어","term":"Bottom-up","ko":"상향식","short":"하위 작업 합산","def":"작은 단위(작업 패키지)를 산정해 위로 합산","pair":"Top-down(상위 분해)","ex":"WBS 작업 패키지별 Bottom-up 산정으로 정확도 향상","key":"Bottom-up","n":9,"ng":6,"src":"131회 정관 3교시 해설 p.12"},{"id":"asis","cat":"답안 서술어","term":"As-Is / To-Be","ko":"현행 / 목표","short":"현행 분석 목표 설계","def":"As-Is = 현재 상태 분석, To-Be = 바람직한 목표 모델","pair":"Gap 분석(둘의 차이)","ex":"ISP는 As-Is 분석 → 목표 모델 → 이행 계획","key":"As-Is","n":17,"ng":14,"src":"138회 정관 2교시 해설 p.8"},{"id":"resilience","cat":"답안 서술어","term":"Resilience","ko":"회복 탄력성","short":"장애 후 빠른 복구","def":"장애·충격 후 빠르게 정상 상태로 돌아오는 능력","pair":"Robustness(견고성: 장애를 견딤)","ex":"카오스 엔지니어링으로 시스템 Resilience 검증","key":"Resilience","n":7,"ng":6,"src":"139회 정관 4교시 해설 p.15"},{"id":"scalability","cat":"답안 서술어","term":"Scalability","ko":"확장성","short":"부하 증가 대응 능력","def":"부하가 늘 때 자원을 늘려 성능을 유지하는 능력","pair":"Scale-up(수직) · Scale-out(수평)","ex":"Scale-out 구조로 Scalability 확보","key":"Scalability","n":21,"ng":15,"src":"140회 정관 1교시 해설 p.13"},{"id":"interoperability","cat":"답안 서술어","term":"Interoperability","ko":"상호운용성","short":"이기종 간 연동 능력","def":"서로 다른 시스템이 데이터·기능을 주고받아 함께 동작하는 능력","pair":"Portability(이식성)","ex":"표준 API로 기관 간 Interoperability 확보","key":"Interoperability","n":8,"ng":6,"src":"140회 정관 1교시 해설 p.12"},{"id":"traceability","cat":"답안 서술어","term":"Traceability","ko":"추적성","short":"요구↔테스트 연결","def":"요구사항 ↔ 설계 ↔ 코드 ↔ 테스트를 양방향으로 따라갈 수 있는 성질","pair":"RTM(요구사항 추적 매트릭스)","ex":"요구사항 추적표로 양방향 Traceability 확보","key":"Traceability","n":8,"ng":4,"src":"140회 정관 2교시 해설 p.26"},{"id":"lockin","cat":"답안 서술어","term":"Lock-in","ko":"종속","short":"특정 벤더 종속","def":"특정 벤더 기술에 묶여 바꾸기 어렵고 비용이 큰 상태","pair":"Multi-cloud · 개방형 표준","ex":"멀티 클라우드로 벤더 Lock-in 회피","key":"Lock-in","n":15,"ng":11,"src":"140회 정관 2교시 해설 p.5"},{"id":"legacy","cat":"답안 서술어","term":"Legacy","ko":"레거시","short":"노후 기존 시스템","def":"오래되어 바꾸기 어렵지만 업무상 계속 쓰는 기존 시스템","pair":"Modernization(현대화)","ex":"Legacy 시스템을 재공학으로 MSA 전환","key":"Legacy","n":7,"ng":5,"src":"137회 정관 3교시 해설 p.26"},{"id":"silo","cat":"답안 서술어","term":"Silo","ko":"사일로","short":"부서별 단절 상태","def":"조직·데이터가 부서별로 단절되어 공유·협업이 안 되는 상태","pair":"Cross-functional(교차 기능 팀)","ex":"데이터 Silo 해소를 위해 Data Lake 구축","key":"Silo","n":7,"ng":3,"src":"139회 정관 1교시 해설 p.15"},{"id":"bottleneck","cat":"답안 서술어","term":"Bottleneck","ko":"병목","short":"전체 성능 제한 지점","def":"전체 처리 성능을 제한하는 가장 느린 지점","pair":"Throughput(처리량)","ex":"메모리 대역폭 Bottleneck 해소를 위해 HBM·CXL 도입","key":"Bottleneck","n":4,"ng":3,"src":"119회 정관 1교시 해설 p.7"},{"id":"overhead","cat":"답안 서술어","term":"Overhead","ko":"오버헤드","short":"본 작업 외 추가 부담","def":"본 작업 외에 추가로 드는 시간·자원·비용","pair":"Efficiency(효율)","ex":"가상화 Overhead를 줄이려 컨테이너 사용","key":"Overhead","n":11,"ng":9,"src":"133회 정관 1교시 해설 p.9"}]}</script>
<script>
(function(){
'use strict';

/* ---------- 기본 ---------- */
var $ = function(s){ return document.querySelector(s); };
var app = $('#app'), bar = $('#bar');
var RAW = {};
try { RAW = JSON.parse(document.getElementById('cards').textContent || '{}') || {}; } catch (e) { RAW = {}; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function str(v){ return v == null ? '' : String(v).trim(); }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function norm(s){ return String(s || '').toLowerCase().replace(/\s+/g, ''); }

var CAT_ORDER = ['IT경영','프로젝트관리','SW공학','클라우드·인프라','CA·OS','네트워크·통신','DB·데이터','AI','보안','표준·기관','기타'];
var DOMAIN_ORDER = ['IT경영','프로젝트관리','SW공학'];
var DECKS = [{key:'abbr', name:'약어', prefix:'a-'}, {key:'dueum', name:'두음', prefix:'d-'}, {key:'concept', name:'개념', prefix:'c-'}, {key:'trend', name:'신기술', prefix:'t-'}, {key:'word', name:'용어', prefix:'w-'}];
var DECK_NAME = {abbr:'약어', dueum:'두음', concept:'개념', trend:'신기술', word:'용어'};
var WORD_ORDER = ['표준·제도','프로젝트관리','애자일','리스크·변경','답안 서술어'];
var TREND_ORDER = ['컴시응 선행','정관 다음 칸','최근 발표','재출제'];
var DAYS = [0, 1, 3, 7, 14];

/* ---------- 카드 id: 영숫자와 - 만 그대로, 나머지는 _xxxx(36진 4자리)로 ---------- */
function hash(s){ var h = 0x811c9dc5; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(36); }
function enc(s){
  s = String(s); var o = '';
  for (var ch of s) { o += /[A-Za-z0-9-]/.test(ch) ? ch : '_' + ch.codePointAt(0).toString(36).padStart(4, '0'); }
  if (o.length > 140) o = o.slice(0, 110) + '-' + hash(s);
  return o || 'x';
}
function koSplit(ko){
  ko = str(ko); var i = ko.indexOf('—');
  return i < 0 ? [ko, ''] : [ko.slice(0, i).trim(), ko.slice(i + 1).trim()];
}

/* ---------- 카드 만들기 ---------- */
var CARDS = [], BY_ID = new Map();
(function(){
  var used = new Set();
  function take(cands){
    for (var i = 0; i < cands.length; i++) { if (!used.has(cands[i])) { used.add(cands[i]); return cands[i]; } }
    var base = cands[cands.length - 1], n = 2; while (used.has(base + '-' + n)) n++;
    used.add(base + '-' + n); return base + '-' + n;
  }
  (Array.isArray(RAW.abbr) ? RAW.abbr : []).forEach(function(a){
    if (!a) return; var abbr = str(a.abbr); if (!abbr) return;
    var full = str(a.full), ko = str(a.ko), ks = koSplit(ko);
    CARDS.push({deck:'abbr', id:take(['a-' + enc(abbr), 'a-' + enc(abbr + ' ' + (full || ko))]), cat:str(a.cat) || '기타',
      abbr:abbr, full:full, ko:ko, name:ks[0], mean:ks[1]});
  });
  (Array.isArray(RAW.dueum) ? RAW.dueum : []).forEach(function(d){
    if (!d) return; var du = str(d.dueum), topic = str(d.topic); if (!du && !topic) return;
    var items = Array.isArray(d.items) ? d.items.map(str).filter(Boolean) : [];
    CARDS.push({deck:'dueum', id:take(['d-' + enc(topic + ' ' + du)]), cat:str(d.cat) || '기타', dueum:du, topic:topic, items:items});
  });
  (Array.isArray(RAW.concepts) ? RAW.concepts : []).forEach(function(c){
    if (!c) return; var topic = str(c.topic); if (!topic) return;
    CARDS.push({deck:'concept', id:take(['c-' + enc(str(c.id) || topic)]), cat:str(c.domain) || '기타', imp:str(c.imp),
      group:str(c.group), topic:topic, keys:str(c.keys), def:str(c.def), exam:str(c.exam), itpe:str(c.itpe)});
  });
  (Array.isArray(RAW.trends) ? RAW.trends : []).forEach(function(c){
    if (!c) return; var topic = str(c.topic); if (!topic) return;
    CARDS.push({deck:'trend', id:take(['t-' + enc(str(c.id) || topic)]), cat:str(c.basis) || '기타', imp:str(c.tier),
      group:'', topic:topic, base:str(c.base), keys:str(c.kw), def:str(c.def), exam:str(c.src), itpe:''});
  });
  (Array.isArray(RAW.terms) ? RAW.terms : []).forEach(function(c){
    if (!c) return; var term = str(c.term); if (!term) return;
    var ng = +c.ng || 0;
    CARDS.push({deck:'word', id:take(['w-' + enc(str(c.id) || term)]), cat:str(c.cat) || '기타', imp:ng >= 10 ? '자주' : '',
      group:'', topic:term, ko:str(c.ko), short:str(c.short), def:str(c.def), pair:str(c.pair), ex:str(c.ex), key:str(c.key) || term,
      src:str(c.src), ng:ng, keys:'', exam:''});
  });
  CARDS.forEach(function(c){ BY_ID.set(c.id, c); });
})();

/* ---------- 브라우저 저장 (모든 접근 try/catch) ---------- */
var LS = {
  get: function(k){ try { return window.localStorage.getItem(k); } catch (e) { return null; } },
  set: function(k, v){ try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }
};
var LS_OK = (function(){ try { var t = '__itpe_t'; window.localStorage.setItem(t, '1'); window.localStorage.removeItem(t); return true; } catch (e) { return false; } })();
function readJSON(k, d){ var v = LS.get(k); if (!v) return d; try { var o = JSON.parse(v); return o && typeof o === 'object' ? o : d; } catch (e) { return d; } }
var K_PROG = 'itpe-cards.progress.v1', K_UNSYNC = 'itpe-cards.unsynced.v1', K_PREF = 'itpe-cards.prefs.v1';

var pref = Object.assign({deck:'abbr', filt:{}, imp:'전체', dir:'a2m', obo:false, size:10}, readJSON(K_PREF, {}));
if (pref.v !== 2) { pref.size = 10; pref.v = 2; }
pref.filt = Object.assign({abbr:'전체', dueum:'전체', concept:'전체', trend:'전체', word:'전체'}, pref.filt && typeof pref.filt === 'object' ? pref.filt : {});
if (!DECK_NAME[pref.deck]) pref.deck = 'abbr';
if ([0, 5, 10, 20].indexOf(+pref.size) < 0) pref.size = 10;
if (pref.dir !== 'm2a') pref.dir = 'a2m';
function savePref(){ LS.set(K_PREF, JSON.stringify(pref)); }

function normRec(o){
  if (!o || typeof o !== 'object') return null;
  var box = Math.round(+o.box); if (!(box >= 0)) box = 0; if (box > 4) box = 4;
  return {box:box, right:Math.max(0, +o.right || 0), wrong:Math.max(0, +o.wrong || 0), last:+o.last || 0, due:+o.due || 0};
}
var P = {};
(function(){ var o = readJSON(K_PROG, {}); for (var k in o) { var r = normRec(o[k]); if (r) P[k] = r; } })();
var UNSYNC = new Set(Object.keys(readJSON(K_UNSYNC, {})));
function saveLocal(){
  LS.set(K_PROG, JSON.stringify(P));
  var u = {}; UNSYNC.forEach(function(k){ u[k] = 1; }); LS.set(K_UNSYNC, JSON.stringify(u));
}

/* ---------- 진도 저장: db 캡빌리티 우선, 안 되면 이 기기 ---------- */
var S = {mode:'pending', col:null, unsub:null, inflight:new Set(), again:new Set(), migrated:false};
function renderChip(){
  var el = $('#store'); if (!el) return;
  var t = S.mode === 'db' ? '기기 간 동기화' : S.mode === 'pending' ? '저장 위치 확인 중' : (LS_OK ? '이 기기에만 저장' : '저장 안 됨 · 이번 방문만');
  el.textContent = t; el.setAttribute('data-m', S.mode);
  el.title = S.mode === 'db' ? '진도가 계정에 저장되어 다른 기기에서도 이어집니다' : S.mode === 'local' ? '진도가 이 브라우저에만 저장됩니다' : '';
}
function setMode(m){ S.mode = m; renderChip(); }
function fallbackLocal(){
  if (S.unsub) { try { S.unsub(); } catch (e) {} }
  S.unsub = null; S.col = null; setMode('local');
}
function safeUse(c, name){
  try { return Promise.resolve(c.use(name)).catch(function(){ return null; }); } catch (e) { return Promise.resolve(null); }
}
async function initStore(){
  var c = window.claude;
  if (!c || typeof c.use !== 'function') { setMode('local'); return; }
  var res = await Promise.all([safeUse(c, 'user'), safeUse(c, 'db')]);
  var user = res[0], db = res[1];
  if (!db) { setMode('local'); return; }
  if (user && typeof user.isOwner === 'function') {
    var own = null; try { own = await user.isOwner(); } catch (e) {}
    if (own === false) { setMode('local'); return; } /* progress 규칙: owner만 읽고 씀 */
  }
  try { S.col = db.collection('progress'); } catch (e) { setMode('local'); return; }
  setMode('db');
  try { S.unsub = S.col.onSnapshot(onSnap, function(){ fallbackLocal(); }); }
  catch (e) { fallbackLocal(); }
}
function onSnap(snap){
  var next = {};
  snap.docs.forEach(function(d){ if (!d.exists) return; var r = normRec(d.data()); if (r) next[d.id] = r; });
  UNSYNC.forEach(function(id){
    var l = P[id];
    if (!l) delete next[id];
    else if (!next[id] || l.last >= next[id].last) next[id] = l;
  });
  P = next; saveLocal();
  if (!snap.metadata.fromCache && !S.migrated) { S.migrated = true; migrate(); }
  softRender();
}
async function migrate(){
  var ids = Array.from(UNSYNC);
  for (var i = 0; i < ids.length; i++) {
    if (S.mode !== 'db') return;
    var ok = await writeDoc(ids[i], P[ids[i]] ? 'set' : 'del');
    if (ok) UNSYNC.delete(ids[i]);
  }
  saveLocal();
}
async function writeDoc(id, op, retried){
  if (!S.col) { UNSYNC.add(id); saveLocal(); return false; }
  try {
    var ref = S.col.doc(id), r = P[id];
    if (op === 'del' || !r) await ref.delete();

function queueWrite(id){
  if (S.inflight.has(id)) { S.again.add(id); return; }
  S.inflight.add(id);

    S.inflight.delete(id);

}
function persist(id){

function dayStart(t, add){ var d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate() + (add || 0)).getTime(); }
function endToday(){ return dayStart(Date.now(), 1); }
function isDue(id){ var r = P[id]; return !!r && r.due < endToday(); }
function stat(id){ var r = P[id]; if (!r) return 'new'; return r.box >= 3 ? 'known' : r.box >= 1 ? 'unsure' : 'dont'; }
function grade(id, g){
  var now = Date.now(), prev = P[id];
  var box = prev ? prev.box : 0, right = prev ? prev.right : 0, wrong = prev ? prev.wrong : 0;
  if (g === 'dont') { box = 0; wrong++; }
  else if (g === 'know') { box = Math.min(4, box + 1); right++; }
  var due = box === 0 ? now : dayStart(now, DAYS[box]);
  P[id] = {box:box, right:right, wrong:wrong, last:now, due:due};
  persist(id);
}
function gapLabel(box){ return box <= 0 ? '곧 다시' : DAYS[box] + '일 뒤'; }

/* ---------- 필터 ---------- */
function deckCards(deck){ return CARDS.filter(function(c){ return c.deck === deck; }); }
function catsOf(deck){
  var set = new Set(deckCards(deck).map(function(c){ return c.cat; }));
  var order = deck === 'concept' ? DOMAIN_ORDER.concat(CAT_ORDER) : deck === 'trend' ? TREND_ORDER : deck === 'word' ? WORD_ORDER : CAT_ORDER;
  var out = [];
  order.forEach(function(x){ if (set.has(x) && out.indexOf(x) < 0) out.push(x); });
  Array.from(set).sort().forEach(function(x){ if (out.indexOf(x) < 0) out.push(x); });
  return out;
}
function filtered(deck){
  var f = pref.filt[deck] || '전체';
  if (f !== '전체' && catsOf(deck).indexOf(f) < 0) f = pref.filt[deck] = '전체';
  return deckCards(deck).filter(function(c){
    return (f === '전체' || c.cat === f) && (deck !== 'concept' || pref.imp === '전체' || c.imp === pref.imp);
  });
}
function counts(list){
  var o = {known:0, unsure:0, dont:0, 'new':0, due:0};
  list.forEach(function(c){ o[stat(c.id)]++; if (isDue(c.id)) o.due++; });
  return o;
}
function dueSorted(list){ return list.filter(function(c){ return isDue(c.id); }).sort(function(a, b){ return P[a.id].due - P[b.id].due; }).map(function(c){ return c.id; }); }
function scopeLabel(){

  else s.done.add(id);
  s.pos++; s.flipped = false; s.reveal = new Set();
  if (s.pos >= s.queue.length) go('summary'); else render(true);
}
function summaryHTML(){

  h += '<div class="tally"><div class="t ok"><b>' + t.know + '</b>알아요</div><div class="t mid"><b>' + t.unsure + '</b>헷갈려요</div><div class="t bad"><b>' + t.dont + '</b>몰라요</div></div>';
  h += '<div class="stack">';

/* ---------- 4지선다 ---------- */
function quizMode(c){ return c.deck === 'abbr' ? pref.dir : c.deck; }
function optOf(x, mode){
  if (mode === 'a2m') return {t:x.name || x.full, s:x.name && x.full ? x.full : ''};
  if (mode === 'm2a') return {t:x.abbr};
  if (mode === 'dueum') return {t:x.dueum, pen:true};
  return {t:x.topic};
}
function quizOK(c){
  if (c.deck === 'abbr') return !!(c.abbr && (c.name || c.full));
  if (c.deck === 'dueum') return !!(c.dueum && c.topic);
  if (c.deck === 'word') return !!(c.ex && c.key && c.ex.indexOf(c.key) >= 0);
  return !!(c.keys || c.def);
}
function makeQ(c){
  var mode = quizMode(c), q = {id:c.id, mode:mode, pick:null};
  if (mode === 'a2m') { q.prompt = c.abbr; q.cls = 'big'; q.ask = '뜻은?'; }
  else if (mode === 'm2a') { q.prompt = c.name || c.full; q.sub = c.mean; q.ask = '약어는?'; }
  else if (mode === 'dueum') { q.prompt = c.topic; q.ask = '두음은?'; }
  else if (c.deck === 'trend') { q.prompt = c.def; q.cls = 'text'; q.ask = '어느 신기술의 정의일까요?'; }
  else if (c.deck === 'word') { q.prompt = blankKey(c.ex, c.key); q.cls = 'text'; q.ask = '빈칸에 들어갈 용어는?'; }
  else if (c.keys) { q.prompt = c.keys; q.cls = 'pen'; q.ask = '어느 토픽의 두음·키워드일까요?'; }
  else { q.prompt = c.def; q.cls = 'text'; q.ask = '어느 토픽의 정의일까요?'; }
  var right = optOf(c, mode); right.ok = true;
  var seen = new Set([norm(right.t)]), opts = [right];
  var pool = CARDS.filter(function(x){ return x.deck === c.deck && x.id !== c.id && optOf(x, mode).t; });
  var same = shuffle(pool.filter(function(x){ return x.cat === c.cat; })), other = shuffle(pool.filter(function(x){ return x.cat !== c.cat; }));
  same.concat(other).forEach(function(x){
    if (opts.length >= 4) return;
    var o = optOf(x, mode); if (seen.has(norm(o.t))) return;
    seen.add(norm(o.t)); opts.push(o);
  });
  if (opts.length < 2) return null;
  q.opts = shuffle(opts);
  return q;
}
function startQuiz(list){
  var el = list.filter(quizOK);
  if (el.length < 1 || deckCards(pref.deck).length < 2) { toast('4지선다를 만들 카드가 부족해요'); return; }
  var due = shuffle(el.filter(function(c){ return isDue(c.id); }));
  var fresh = shuffle(el.filter(function(c){ return !P[c.id]; }));
  var rest = shuffle(el.filter(function(c){ return P[c.id] && !isDue(c.id); }));
  var picks = [], seen = new Set();
  due.concat(fresh, rest).forEach(function(c){ if (picks.length < 10 && !seen.has(c.id)) { seen.add(c.id); picks.push(c); } });
  var items = shuffle(picks).map(makeQ).filter(Boolean);
  if (!items.length) { toast('4지선다를 만들 카드가 부족해요'); return; }
  st.quiz = {items:items, idx:0, score:0, list:list};
  go('quiz');
}
function quizHTML(){
  var z = st.quiz, q = z.items[z.idx], c = BY_ID.get(q.id);
  var h = '<div class="sess-top"><button type="button" class="link" data-act="end">← 그만하기</button><span class="sess-n">' + (z.idx + 1) + ' / ' + z.items.length + ' · 맞힘 ' + z.score + '</span><span class="tag">4지선다</span></div>';
  h += '<div class="sess-bar" aria-hidden="true"><i style="width:' + (z.idx / z.items.length * 100).toFixed(1) + '%"></i></div>';
  h += '<div class="q-card anim"><div class="card-meta">' + metaChips(c) + '</div><p class="q-ask">' + esc(q.ask) + '</p><p class="q-prompt ' + (q.cls || '') + '">' + esc(q.prompt) + '</p>' + (q.sub ? '<p class="q-sub">' + esc(q.sub) + '</p>' : '') + '</div>';
  h += '<div class="opts-q" role="group" aria-label="보기">';
  q.opts.forEach(function(o, i){
    var cls = '', mark = '';
    if (q.pick != null) {

  });
  h += '</div>';

    var ok = q.opts[q.pick].ok;
    h += '<p class="muted" style="margin-top:12px" role="status">' + (ok ? '맞혔어요. 상자 +1 (' + gapLabel(P[q.id].box) + ')' : '틀렸어요. 상자 0으로 — 오답 노트에 담겼어요.') + '</p>';
  }

}
function qresultHTML(){
  var z = st.quiz, wrong = z.items.filter(function(q){ return q.pick != null && !q.opts[q.pick].ok; });

/* ---------- 오답 노트 ---------- */
function wrongCards(deck){
  return CARDS.filter(function(c){ var r = P[c.id]; return r && r.box <= 1 && (deck === '전체' || c.deck === deck); })
    .sort(function(a, b){ var x = P[a.id], y = P[b.id]; return x.box - y.box || y.wrong - x.wrong || y.last - x.last; });
}
function itemHTML(c, withDeck){
  var r = P[c.id], open = st.open.has(c.id);

}
function wrongHTML(){

  h += '<div class="chips" role="group" aria-label="덱" style="margin-top:12px">';

    h += '<button type="button" class="chip" data-act="wrong-deck" data-v="' + k + '" aria-pressed="' + (st.wrongDeck === k) + '">' + (k === '전체' ? '전체' : DECK_NAME[k]) + '<small>' + n + '</small></button>';
  });

  h += '<button type="button" class="today" data-act="wrong-review"><span><span class="today-k">바로 복습</span><span class="today-s">' + (st.wrongDeck === '전체' ? '모든 덱' : DECK_NAME[st.wrongDeck]) + ' · 상자 0 먼저</span></span><span class="today-n">' + list.length + '<small>장</small></span></button>';
  h += '<ul class="list">' + list.slice(0, 300).map(function(c){ return itemHTML(c, st.wrongDeck === '전체'); }).join('') + '</ul>';

/* ---------- 찾기 ---------- */
var HAY = new Map();
function hay(c){
  if (!HAY.has(c.id)) {
    var t = c.deck === 'abbr' ? [c.abbr, c.full, c.ko] : c.deck === 'dueum' ? [c.dueum, c.topic, c.items.join(' ')] : c.deck === 'word' ? [c.topic, c.ko, c.def, c.pair, c.short] : [c.topic, c.keys, c.def, c.group];
    var s = t.join(' ').toLowerCase(); HAY.set(c.id, [s, s.replace(/\s+/g, '')]);
  }
  return HAY.get(c.id);
}
function searchResults(){
  var q = st.q.trim().toLowerCase();
  if (!q) return '<p class="muted" style="margin-top:12px">약어 ' + deckCards('abbr').length + ' · 두음 ' + deckCards('dueum').length + ' · 개념 ' + deckCards('concept').length + ' · 신기술 ' + deckCards('trend').length + ' · 용어 ' + deckCards('word').length + '장에서 찾아요.</p>';
  var qn = q.replace(/\s+/g, ''), res = [];
  CARDS.forEach(function(c){
    var hs = hay(c); if (!(hs[0].indexOf(q) >= 0 || hs[1].indexOf(qn) >= 0)) return;
    var head = (c.abbr || c.dueum || c.topic || '').toLowerCase(), score = head === q ? 0 : head.indexOf(q) === 0 ? 1 : 2;
    res.push([score, c]);
  });
  res.sort(function(a, b){ return a[0] - b[0]; });
  var h = '<p class="muted" style="margin-top:12px" role="status">' + res.length + '건' + (res.length > 80 ? ' · 앞 80건만 보여요' : '') + '</p>';
  if (!res.length) return h;
  return h + '<ul class="list">' + res.slice(0, 80).map(function(x){ return itemHTML(x[1], true); }).join('') + '</ul>';
}
function searchHTML(){
  return '<h2>찾기</h2><label class="sr-only" for="search-q">약어·풀네임·해석·두음·토픽 검색</label><div class="search"><input id="search-q" type="search" enterkeyhint="search" autocomplete="off" placeholder="약어, 풀네임, 해석, 두음, 토픽, 용어" value="' + esc(st.q) + '"></div><div id="search-res">' + searchResults() + '</div>';
}

/* ---------- 하단 바 ---------- */

    '<button type="button" data-act="tab" data-tab="wrong"' + (cur === 'wrong' ? ' aria-current="page"' : '') + '>오답 노트' + (wn ? '<span class="badge">' + wn + '</span>' : '') + '</button>' +
    '<button type="button" data-act="tab" data-tab="search"' + (cur === 'search' ? ' aria-current="page"' : '') + '>찾기</button></div>';
}

/* ---------- 렌더 ---------- */
function render(keepFocus){
  var s = st.screen, h;
  if (s === 'session') h = sessionHTML();
  else if (s === 'summary') h = summaryHTML();
  else if (s === 'quiz') h = quizHTML();
  else if (s === 'qresult') h = qresultHTML();
  else if (s === 'wrong') h = wrongHTML();
  else if (s === 'search') h = searchHTML();
  else h = homeHTML();

}
function softRender(){
  renderChip();

  else if (st.screen === 'search') bar.innerHTML = barHTML();
}
function go(screen){
  st.screen = screen; st.open = new Set();
  render(screen === 'session');
  window.scrollTo(0, 0);
  if (screen !== 'session') { try { app.focus({preventScroll:true}); } catch (e) {} }
}
var toastTimer = null;

  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 2600);

/* ---------- 동작 ---------- */
var A = {
  deck: function(t){ pref.deck = t.dataset.deck; st.reset = null; savePref(); render(); },
  filt: function(t){ pref.filt[pref.deck] = t.dataset.v; savePref(); render(); },
  imp: function(t){ pref.imp = t.dataset.v; savePref(); render(); },

  obo: function(t){ pref.obo = t.dataset.v === '1'; savePref(); render(); },
  size: function(t){ pref.size = +t.dataset.v || 0; savePref(); render(); },
  today: function(){
    var list = filtered(pref.deck), due = dueSorted(list);

    else startSession(learnIds(list), list.some(function(c){ return !P[c.id]; }) ? '새 카드' : '다시 보기');
  },
  learn: function(){ startSession(learnIds(filtered(pref.deck)), '카드 학습'); },
  quiz: function(){ startQuiz(filtered(pref.deck)); },
  flip: function(){ flip(); },
  g: function(t){ gradeCurrent(t.dataset.g); },
  reveal: function(t){ var s = st.session; if (!s) return; var i = +t.dataset.i; if (s.reveal.has(i)) s.reveal.delete(i); else s.reveal.add(i); render(true); var b = app.querySelector('[data-act="reveal"][data-i="' + i + '"]'); if (b) { try { b.focus({preventScroll:true}); } catch (e) {} } },
  'reveal-all': function(){ var s = st.session; if (!s) return; var c = BY_ID.get(s.queue[s.pos]); for (var i = 0; i < Math.max(tokens(c.dueum).length, c.items.length); i++) s.reveal.add(i); render(true); },
  end: function(){
    if (st.screen === 'session') { if (st.session.graded) go('summary'); else go('home'); }

  },
  home: function(){ go('home'); },
  tab: function(t){ go(t.dataset.tab); if (t.dataset.tab === 'search') { var i = $('#search-q'); if (i && !st.q) { try { i.focus({preventScroll:true}); } catch (e) {} } } },
  'sum-again': function(){ startSession(st.session.ids.filter(function(id){ return P[id] && P[id].box === 0; }), '다시 보기'); },
  answer: function(t){

  'quiz-more': function(){ startQuiz(st.quiz.list); },
  'wrong-deck': function(t){ st.wrongDeck = t.dataset.v; st.open = new Set(); render(); },

  toggle: function(t){

    var b = app.querySelector('[data-act="toggle"][data-id="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]'); if (b) { try { b.focus({preventScroll:true}); } catch (e) {} }
  },
  'reset-open': function(){ st.reset = {step:'choose'}; render(); },
  'reset-scope': function(t){ st.reset = {step:'confirm', scope:t.dataset.v}; render(); },
  'reset-cancel': function(){ st.reset = null; render(); },
  'reset-go': async function(){
    var scope = st.reset.scope, ids = resetIds(scope), nm = scope === 'all' ? '전체 덱' : DECK_NAME[scope];
    st.reset = {step:'run', scope:scope, n:0, total:ids.length}; render();
    ids.forEach(function(id){ delete P[id]; });
    if (S.mode === 'db') {
      ids.forEach(function(id){ UNSYNC.add(id); }); saveLocal();
      for (var i = 0; i < ids.length; i++) {
        var ok = await writeDoc(ids[i], 'del');
        if (ok) UNSYNC.delete(ids[i]);
        if (st.reset) { st.reset.n = i + 1; var el = $('#reset-n'); if (el) el.textContent = String(i + 1); }

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  var f = A[t.dataset.act]; if (f) f(t, e);
});
document.addEventListener('input', function(e){
  if (e.target && e.target.id === 'search-q') { st.q = e.target.value; st.open = new Set(); $('#search-res').innerHTML = searchResults(); }
});
document.addEventListener('keydown', function(e){
  if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var onBtn = e.target && e.target.tagName === 'BUTTON';
  if (st.screen === 'session') {
    if ((e.key === ' ' || e.key === 'Enter') && !onBtn) { e.preventDefault(); flip(); }
    else if (st.session.flipped && (e.key === '1' || e.key === '2' || e.key === '3')) { e.preventDefault(); gradeCurrent({'1':'dont', '2':'unsure', '3':'know'}[e.key]); }
  } else if (st.screen === 'quiz') {
    var z = st.quiz, q = z.items[z.idx];
    if (q.pick == null && /^[1-4]$/.test(e.key) && +e.key <= q.opts.length) { e.preventDefault(); A.answer({dataset:{i:String(+e.key - 1)}}); }
    else if (q.pick != null && e.key === 'Enter' && !onBtn) { e.preventDefault(); A.next(); }
  }
});

/* ---------- 시작: 저장소 없이 먼저 그린다 ---------- */
renderChip();
render();
initStore().catch(function(){ setMode('local'); });
})();
